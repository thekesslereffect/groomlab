# Licensing for files that can't carry an SPDX header (data, images, docs, configs), in the REUSE
# format (https://reuse.software). Source files say their license in their first lines instead.
# The license texts are in LICENSES/.
version = 1

# Everything of GroomLab's own: Apache-2.0 (files with their own SPDX header keep it).
[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Nick Rutlinh"
SPDX-License-Identifier = "Apache-2.0"

# Test data: synthetic scenes (tests/data/yeti: written by make_scenes.py), golden outputs
# (tests/data/golden, PresetDigests.json, PresetLooks.json), fixtures. GroomLab's own.
[[annotations]]
path = ["tests/data/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Nick Rutlinh"
SPDX-License-Identifier = "Apache-2.0"

# The sample meshes shipped with the Maya plugin, the Blender add-on and the app (Nika, Manny, the
# wolf, Buddy: buddy.obj and its rig, buddy_rig.ma and buddy_rig.fbx): CC BY 4.0 (credit "Nika head
# by Nick Rutlinh (GroomLab), CC BY 4.0", "Manny head by Nick Rutlinh (GroomLab), CC BY 4.0", "Wolf
# by Nick Rutlinh (GroomLab), CC BY 4.0", "Buddy by Nick Rutlinh (GroomLab), CC BY 4.0"), separate
# from the code's Apache-2.0.
[[annotations]]
path = ["hosts/maya/meshes/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Nick Rutlinh"
SPDX-License-Identifier = "CC-BY-4.0"

# The Blender add-on: GPL-3.0-or-later (it imports bpy).
[[annotations]]
path = ["hosts/blender/addon/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Nick Rutlinh"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The C API samples: MIT, so they can be copied into anyone's tools.
[[annotations]]
path = ["engine/capi/samples/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Nick Rutlinh"
SPDX-License-Identifier = "MIT"

# Slang's C++ prelude headers (the CPU engine's kernels, slangc's C++, compile against them),
# vendored: Apache-2.0 WITH LLVM-exception.
[[annotations]]
path = ["third_party/slang/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Slang authors"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# stb_image (Sean Barrett), vendored: MIT or public domain, at your choice.
[[annotations]]
path = ["third_party/stb/**"]
precedence = "override"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

# The app's fonts.
[[annotations]]
path = ["hosts/app/fonts/Figtree*", "hosts/app/fonts/OFL-Figtree.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Figtree Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["hosts/app/fonts/JetBrainsMono*", "hosts/app/fonts/OFL-JetBrainsMono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# License texts shipped with the app for Qt and its third-party code: verbatim copies.
[[annotations]]
path = ["hosts/app/package/licenses/**", "hosts/app/package/spdx/**", "hosts/blender/addon/LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-Verbatim"

# The renderer logos: their owners' trademarks, shown only to say GroomLab works with them
[[annotations]]
path = ["web/public/renderers/**"]
precedence = "override"
SPDX-FileCopyrightText = ["Autodesk, Inc.", "Pixar", "Chaos Software"]
SPDX-License-Identifier = "LicenseRef-Trademark"

# The groom viewer's sample groom (engine/web/tools/make_sample.mjs) and the landing page's 3D head
# (manny_head.bin, written by tools/web/make_head_mesh.py): the Manny head in them is CC BY 4.0
# ("Manny head by Nick Rutlinh (GroomLab), CC BY 4.0", credited in the site footer), and so they are.
[[annotations]]
path = ["web/public/samples/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Nick Rutlinh"
SPDX-License-Identifier = "CC-BY-4.0"

# The groom viewer's engine, built by Emscripten (engine/web, docs/WEB.md): GroomLab's core with
# nlohmann/json (MIT), stb_image (MIT) and Emscripten's runtime (MIT; its libc++ is Apache-2.0
# WITH LLVM-exception) compiled in.
[[annotations]]
path = ["web/public/wasm/groomlab.js", "web/public/wasm/groomlab.wasm"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Nick Rutlinh", "Emscripten authors", "Niels Lohmann", "Sean Barrett"]
SPDX-License-Identifier = "Apache-2.0 AND MIT"

# The GroomLab name and logo in the press kit: trademarks, not under the software's licenses.
[[annotations]]
path = ["web/public/press/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Nick Rutlinh"
SPDX-License-Identifier = "LicenseRef-Trademark"

# The wolf sample groom (model, maps, groom), when its files land: CC BY 4.0.
[[annotations]]
path = ["samples/wolf/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Nick Rutlinh"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["samples/wolf/README.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Nick Rutlinh"
SPDX-License-Identifier = "Apache-2.0"
